<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:GSF;src:url('../../template/fonts/google-sans-flex-latin-full-normal.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
@font-face{font-family:GSF;src:url('../../template/fonts/google-sans-flex-latin-ext-full-normal.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%;unicode-range:U+0100-02AF}
@font-face{font-family:GSC;src:url('../../template/fonts/google-sans-code-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:Caveat;src:url('../../testes-capa/serie/caveat-latin-700-normal.woff2') format('woff2');font-weight:700}
html,body{margin:0}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1E0B4A;font-family:GSF;color:#fff}
.bg{position:absolute;left:50%;top:-40px;height:2000px;transform:translateX(-50%);filter:blur(22px) brightness(.55) saturate(1.1)}
.dim{position:absolute;inset:0;background:linear-gradient(rgba(20,6,50,.25),rgba(20,6,50,.55))}
.top{position:absolute;top:250px;left:0;right:0;text-align:center}
.pill{display:inline-block;font-family:GSC;font-size:30px;letter-spacing:4px;padding:18px 34px;border-radius:999px;background:#FFD3B8;color:#1E0B4A}
.card{position:absolute;left:50%;top:420px;width:680px;height:850px;transform:translateX(-50%) rotate(-3deg);border-radius:36px;overflow:hidden;box-shadow:0 40px 90px rgba(10,0,30,.6),0 0 0 3px rgba(255,255,255,.18)}
.card img{width:100%;height:100%;display:block}
.cta{position:absolute;left:0;right:0;top:1380px;text-align:center}
.cta .s{font-family:Caveat;font-weight:700;font-size:72px;color:#FFD3B8;text-shadow:0 3px 18px rgba(30,8,70,.85)}
.cta .t{font-weight:800;font-size:110px;line-height:.95;letter-spacing:-2px;margin-top:6px;text-shadow:0 6px 30px rgba(10,0,30,.5)}
.cta svg{display:block;margin:26px auto 0}
.foot{position:absolute;bottom:200px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;font-weight:600;font-size:34px}
.foot img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.3)}
</style></head><body><div class="c">
<img class="bg" src="../../testes-capa/serie/bg-cd.png">
<div class="dim"></div>
<div class="top"><span class="pill">POST NOVO</span></div>
<div class="card"><img src="../slide-01.png"></div>
<div class="cta"><div class="s">O que dá pra fazer no plano grátis</div></div>
<div class="foot"><img src="../../template/assets/avatar-hd.webp">@urlan.design</div>
</div></body></html>

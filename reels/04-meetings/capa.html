<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:GSF;src:url('gsf.woff2') format('woff2');font-weight:1 1000;font-stretch:25% 151%}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0E0C12;position:relative;overflow:hidden;font-family:GSF,sans-serif;color:#F4F1FA}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:900px;height:900px;left:-300px;top:900px;background:#7A4DE0;opacity:.55}
.g2{width:800px;height:800px;right:-300px;top:1150px;background:#C9A8FF;opacity:.35}
.title{position:absolute;left:80px;top:360px;font-size:176px;font-weight:800;letter-spacing:-0.035em;line-height:.96}
.title span{color:#C9A8FF}
.sub{position:absolute;left:84px;top:760px;font-size:50px;font-weight:600;color:#CFC8DD;max-width:800px;line-height:1.15}
.sub b{color:#C9A8FF;font-weight:700}
.t{position:absolute;width:400px;height:400px;border-radius:40px;overflow:hidden;border:3px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.55)}
.t img{width:100%;height:100%;object-fit:cover}
.t i{position:absolute;left:20px;bottom:18px;font-style:normal;font-size:28px;font-weight:600;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:14px}
.t1{left:70px;top:1010px;transform:rotate(-6deg)}
.t2{left:540px;top:960px;transform:rotate(5deg)}
.t3{left:140px;top:1290px;transform:rotate(3deg);width:360px;height:360px}
.cl{left:560px;top:1330px;transform:rotate(-4deg);width:400px;height:300px;background:#C9A8FF;border-color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0E0C12}
.cl .s{font-size:110px;line-height:1}
.cl .n{font-size:40px;font-weight:700;margin-top:8px}
.bub{position:absolute;left:300px;top:1000px;background:#fff;color:#0E0C12;font-size:36px;font-weight:700;padding:20px 28px;border-radius:30px 30px 30px 6px;transform:rotate(-3deg);box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:5}
.beta{position:absolute;left:84px;top:300px;font-size:30px;font-weight:700;letter-spacing:.12em;color:#0E0C12;background:#C9A8FF;padding:10px 22px;border-radius:999px}
.il{position:absolute;right:84px;top:1665px;font-size:24px;letter-spacing:.08em;color:#8E879C;text-transform:uppercase;font-weight:600}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="beta">BETA</div>
<div class="title">Claude<br><span>Meetings</span></div>
<div class="sub">O Claude agora entra na sua <b>reunião</b>.</div>
<div class="t t1"><img src="ana.jpg"><i>Ana</i></div>
<div class="t t2"><img src="bruno.jpg"><i>Bruno</i></div>
<div class="t t3"><img src="carla.jpg"><i>Carla</i></div>
<div class="t cl"><div class="s">✦</div><div class="n">Claude</div></div>
<div class="bub">Claude, make a doc.</div>
<div class="il">Ilustração</div>
</body></html>
